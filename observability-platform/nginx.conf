# nginx site for the Neoh AWS observability dashboard (production image).
# Static-only: the ALB routes this dashboard's host default to it, and that host's
# /api/*, /ws, /auth/* to the backend target group, so nothing is proxied here.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ALB health check target (cheap, never cached).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Long-cache fingerprinted assets; Vite hashes filenames so this is safe.
    # This block declares its own add_header (Cache-Control), so nginx drops the
    # server-level security headers here — they must be repeated to reach the
    # JS/CSS bundles (same non-merge rule as `location = /index.html` below).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # SPA fallback — every non-file route resolves to index.html so client-side
    # routing works on hard refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients pin a stale bundle.
    # nginx does NOT merge add_header across levels — a location with its own
    # add_header drops the server-level ones — so the security headers are
    # repeated here to guarantee they reach the HTML document.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Baseline security headers for all other (no-own-add_header) locations,
    # incl. `location /` which serves deep-link routes via the SPA fallback.
    # (CSP is intentionally omitted here — a too-strict policy white-screens the
    # WebGL/worker SPA; tune it deliberately before enabling.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;
}
