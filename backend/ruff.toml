# Audit 35-03: a phased static gate. Phase 1 is the must-pass set that finds
# real runtime failures with no style noise: syntax errors (E9), invalid
# comparisons (F63), misplaced return/yield/break (F7) and undefined or
# unbound names (F82, which caught an UnboundLocalError in the email send
# path). Widen the selection one rule family at a time, fixing as you go.
#
# Phase 2 adds F841 (a local assigned and never read) and F811 (a name
# redefined before its first binding was used). Both hide logic slips: a
# value computed for a check that never ran, or a test whose real call was
# replaced by a copy of the rule it meant to test.
# Where a finding is intended, such as a test parameter that is a pytest
# fixture imported from another module, the line carries a targeted
# `# noqa: F811` with its reason, never a file- or rule-wide ignore.
#
# Phase 3 adds F401 (an import nothing uses). A noqa on the FIRST line of a
# multi-line import silences every name in it: the state_compliance split
# carried "# noqa: F401 (re-exported for route handlers)" over 178 names that
# nothing imported. A genuine re-export carries a one-name noqa with the
# importer named (agent_mind/__init__.py).
target-version = "py312"
extend-exclude = ["venv", "node_modules", "pascal-editor"]

[lint]
select = ["E9", "F63", "F7", "F82", "F841", "F811", "F401"]
