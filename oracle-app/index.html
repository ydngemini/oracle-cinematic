<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the bottom Deck pads itself with safe-area-inset
         on notched phones; without it iOS letterboxes the standalone PWA. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <script>
      // Stamp the chosen theme before any CSS paints. Light is the default;
      // a stored 'dark' must not flash white on load. Mirrors src/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('neoh.theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
          else if (t !== 'system') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Safari only enables standalone home-screen launch via the apple-
         prefixed meta; it ignores mobile-web-app-capable. Keep both. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neoh" />
    <link rel="apple-touch-icon" href="/oracle-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Neoh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
