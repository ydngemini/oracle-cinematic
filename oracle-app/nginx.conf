# nginx site for the Neoh SPA (production image). Static-only: the ALB sends
# /api/* and /ws/* to the backend target group, so nothing is proxied here.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ALB health check target (cheap, never cached).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Long-cache fingerprinted assets; Vite hashes filenames so this is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every non-file route resolves to index.html so client-side
    # routing works on hard refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Baseline security headers (the app sets its own CSP/headers server-side for
    # API responses; these cover the static shell).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 25m;  # matches backend media upload cap headroom
}
