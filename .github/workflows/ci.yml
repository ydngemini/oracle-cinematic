name: CI

# The repository had no automated enforcement before this workflow: 670+ tests
# and nothing that ran them on a push. A working-tree change that broke two of
# its own tests reached the branch unnoticed, which is exactly the class of
# mistake this exists to catch.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to actually deploy to DigitalOcean (any other value, or leaving this blank, only runs tests)'
        required: true
        default: ""

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Matches backend/Dockerfile (python:3.12-slim) so a green run here means
      # the same interpreter the image ships.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt

      # conftest.py sets ORACLE_ENV=dev and a throwaway secret itself, and the
      # suite needs no database — it runs entirely on fakes and monkeypatching.
      #
      # compliance_engine/tests is named explicitly because it lives outside
      # tests/ and so was never collected: 84 tests covering the TCPA/BIPA/CA-ARL
      # engine ran nowhere, in CI or locally. It needs no fixtures from
      # tests/conftest.py — both directories are packages with no shared module
      # names — but conftest's env defaults still apply, because they load once
      # for the whole session as long as tests stays in the argument list.
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests compliance_engine/tests -q

      # Fails the build on any known CVE in a pinned dependency. Runs after the
      # tests so a vulnerable-but-working tree still reports its test result
      # first. Reads requirements.txt rather than the installed environment, so
      # what it audits is what production installs.
      - name: Dependency vulnerabilities
        working-directory: backend
        run: python -m pip_audit --strict --skip-editable -r requirements.txt

  frontend:
    name: frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Matches the node image in docker-compose.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: oracle-app/package-lock.json

      - name: Install dependencies
        working-directory: oracle-app
        run: npm ci --no-audit --no-fund

      # Two lint extensions were attempted here and both are blocked upstream,
      # verified 2026-08-11 — don't re-attempt without checking these first:
      #
      #   * typescript-eslint (to lint .ts/.tsx) peer-requires TypeScript
      #     <6.1.0 at its newest release; this repo is on 7.0.2. No published
      #     version supports it. `typecheck` below is what guards those files
      #     meanwhile — it is the only gate that reads them at all.
      #   * eslint-plugin-jsx-a11y peer-supports ESLint <=9; this repo is on 10.
      #     It loads fine, but installing it makes `npm ci` fail outright, which
      #     breaks this whole job. Accessibility is covered by axe-core inside
      #     vitest instead (see the accessibility phase of the plan).
      - name: Lint
        working-directory: oracle-app
        run: npx eslint src --max-warnings=0

      # The only gate that reads PropertyTourViewer.tsx, lib/tour/* and
      # lib/floorplan/* at all.
      - name: Typecheck
        working-directory: oracle-app
        run: npm run typecheck

      - name: Unit tests
        working-directory: oracle-app
        run: npm test

      # Catches what lint and unit tests cannot: a bad import path or a
      # component that fails to compile still lints clean and is never imported
      # by a test.
      - name: Build
        working-directory: oracle-app
        run: npm run build

      # Bundle weight only ever regresses by accident. Vite warns and exits 0;
      # this exits 1.
      - name: Bundle budget
        working-directory: oracle-app
        run: npm run bundle:check

  # Only after both test jobs pass, and only on main — a PR branch builds and
  # tests but never deploys. Every image is tagged with the commit SHA, never
  # :latest, so a rollback means redeploying a known-good SHA, not guessing
  # which :latest used to be good. See docs/deploy-digitalocean.md.
  # Manual-only on purpose: a push to main is not "deploy now." Run via the
  # Actions tab's "Run workflow" button (or `gh workflow run ci.yml -f
  # confirm=deploy`), which also means DigitalOcean secrets need not exist in
  # this repo at all until the day someone actually intends to deploy — every
  # push before then runs tests and stops there, cleanly.
  deploy:
    name: deploy to DigitalOcean
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: doctl auth
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build release identity
        id: release
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Immutable tag: the git SHA. :latest is also pushed for convenience
      # (so `doctl registry ... | head` reads naturally) but the app spec
      # (infra/digitalocean/app.yaml) and every deploy step below reference
      # the SHA tag, never :latest — see GET /version.
      - name: Build and push backend image
        run: |
          docker build \
            --build-arg GIT_SHA="${{ steps.release.outputs.sha }}" \
            --build-arg APP_VERSION="${{ github.ref_name }}" \
            --build-arg BUILD_TIMESTAMP="${{ steps.release.outputs.built_at }}" \
            -t "${REGISTRY}/neoh-backend:${{ steps.release.outputs.sha }}" \
            -t "${REGISTRY}/neoh-backend:latest" \
            -f backend/Dockerfile .
          docker push "${REGISTRY}/neoh-backend:${{ steps.release.outputs.sha }}"
          docker push "${REGISTRY}/neoh-backend:latest"
        env:
          REGISTRY: registry.digitalocean.com/${{ secrets.DIGITALOCEAN_REGISTRY }}

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE="${{ secrets.NEOH_PUBLIC_API_BASE }}" \
            --build-arg VITE_WS_URL="${{ secrets.NEOH_PUBLIC_WS_URL }}" \
            --build-arg VITE_GOOGLE_MAPS_KEY="${{ secrets.VITE_GOOGLE_MAPS_KEY }}" \
            --build-arg VITE_GOOGLE_MAP_ID="${{ secrets.VITE_GOOGLE_MAP_ID }}" \
            -t "${REGISTRY}/neoh-frontend:${{ steps.release.outputs.sha }}" \
            -t "${REGISTRY}/neoh-frontend:latest" \
            -f oracle-app/Dockerfile oracle-app
          docker push "${REGISTRY}/neoh-frontend:${{ steps.release.outputs.sha }}"
          docker push "${REGISTRY}/neoh-frontend:latest"
        env:
          REGISTRY: registry.digitalocean.com/${{ secrets.DIGITALOCEAN_REGISTRY }}

      # Migrations before the new image serves traffic, matching
      # infra/scripts/run-migrations.sh's AWS ordering. Runs the freshly-built
      # SHA-tagged image directly via doctl (no App Platform component
      # involved), so a migration failure never partially deploys a release.
      - name: Run database migrations
        run: |
          doctl registry docker-config > /tmp/docker-config.json
          docker run --rm \
            -e ORACLE_DB_HOST="${{ secrets.ORACLE_DB_HOST }}" \
            -e ORACLE_DB_PORT="${{ secrets.ORACLE_DB_PORT }}" \
            -e ORACLE_DB_NAME="${{ secrets.ORACLE_DB_NAME }}" \
            -e ORACLE_DB_ADMIN_USER="${{ secrets.ORACLE_DB_ADMIN_USER }}" \
            -e ORACLE_DB_ADMIN_PASSWORD="${{ secrets.ORACLE_DB_ADMIN_PASSWORD }}" \
            -e ORACLE_DB_SSL=require \
            "${REGISTRY}/neoh-backend:${{ steps.release.outputs.sha }}" \
            python run_migrations.py
        env:
          REGISTRY: registry.digitalocean.com/${{ secrets.DIGITALOCEAN_REGISTRY }}

      # Updates the App Platform app in place from the spec, pinning both the
      # api service and the worker to this exact image digest — not a moving
      # tag — so what App Platform deploys is provably what was just built
      # and migrated against, not whatever :latest resolves to by the time
      # the rollout actually happens.
      - name: Deploy to App Platform
        run: |
          doctl apps update "${{ secrets.DIGITALOCEAN_APP_ID }}" \
            --spec infra/digitalocean/app.yaml \
            --wait

      - name: Smoke test
        run: |
          chmod +x infra/digitalocean/smoke-test.sh
          APP_URL="${{ secrets.NEOH_PUBLIC_API_BASE }}" \
          EXPECTED_GIT_SHA="${{ steps.release.outputs.sha }}" \
            ./infra/digitalocean/smoke-test.sh

      # Rollback is a redeploy of the previous known-good SHA — see
      # docs/deploy-digitalocean.md §Rollback. Left manual on purpose: an
      # automated rollback on a failed smoke test can itself deploy into an
      # already-degraded database (e.g. a migration that half-applied), which
      # is a worse state than a human looking at the smoke-test output first.
