# DigitalOcean App Platform spec for Neoh production.
#
# Apply with: doctl apps create --spec infra/digitalocean/app.yaml
# Update with: doctl apps update <app-id> --spec infra/digitalocean/app.yaml
#
# Component shape, chosen from the actual repository (see
# docs/deploy-digitalocean.md for the full audit this maps to):
#
#   api       (service)      — the FastAPI backend. Horizontally scalable:
#                               ORACLE_PROCESS_ROLE=web means it never starts
#                               the periodic scheduler or any of the
#                               replica-unsafe in-process job queues
#                               (voice_intel.py, reconstruction_worker.py).
#                               Cross-replica WebSocket fan-out rides Postgres
#                               LISTEN/NOTIFY, not Redis, so this needs no
#                               sticky sessions.
#   worker    (worker)       — the SAME image, ORACLE_PROCESS_ROLE=worker.
#                               Runs the periodic scheduler (MLS/Bridge sync,
#                               mission ticks, outcome attribution, etc.), the
#                               durable job queue, and the voice/reconstruction/
#                               video-studio in-process workers. Pinned at
#                               instance_count: 1 — those in-process queues
#                               have no cross-replica coordination, so a
#                               second worker instance would silently miss
#                               half of whatever it's racing the first one for.
#   web       (static_site)  — the Vite SPA. App Platform builds it from the
#                               existing oracle-app/Dockerfile (build stage
#                               only matters; the static-site build extracts
#                               output_dir from the built image) and serves it
#                               from DO's CDN — cheaper and simpler than
#                               running nginx as a always-on service for
#                               something that never changes per-request.
#
# GPU reconstruction is NOT a DigitalOcean component: it already dispatches to
# an external GPU provider (RunPod, via RECON_POD_* / RUNPOD_* env vars) —
# nothing here needs to change for that, and DO has no comparable GPU product
# to move it to.
#
# Managed PostgreSQL and Managed Valkey are provisioned ONCE, separately (see
# docs/deploy-digitalocean.md §Database/§Redis), never created BY this spec —
# `production: true` + `cluster_name` below only ATTACHES an already-existing
# cluster so its real connection info resolves into the ${name.FIELD}
# bindable variables the components use; it does not create or manage the
# cluster's lifecycle, so a `doctl apps update` can never destroy it. Replace
# cluster_name with your actual DO-assigned cluster name (`doctl databases
# list`) before applying. Spaces has no "databases" concept in an app spec —
# it's referenced purely as secrets (ORACLE_S3_*) below.
databases:
  - name: neoh-postgres
    engine: PG
    production: true
    cluster_name: neoh-postgres # <- replace with your real cluster name
    db_name: oracle
    db_user: oracle_app_login
  - name: neoh-redis
    engine: VALKEY
    production: true
    cluster_name: neoh-redis # <- replace with your real cluster name

name: neoh
region: nyc

services:
  - name: api
    # DIGEST, not dockerfile_path. This component used to declare
    # `dockerfile_path: backend/Dockerfile`, which made App Platform build its
    # OWN image at deploy time — so the image CI built, tested and migrated
    # against was pushed to the registry and then orphaned. Production ran an
    # artifact nothing had tested.
    #
    # `__BACKEND_DIGEST__` is substituted by the deploy job. It is deliberately
    # left as a placeholder in the committed file: a real digest checked in here
    # would pin every future deploy to one historical build.
    #
    # `digest` and `deploy_on_push` are mutually exclusive in the App Spec, so
    # pinning means CI drives deploys itself — which is the intent. Nothing
    # should reach production because an image appeared in a registry.
    image:
      registry_type: DOCR
      repository: neoh-backend
      digest: __BACKEND_DIGEST__
    http_port: 8000
    instance_count: 2
    instance_size_slug: apps-s-2vcpu-4gb
    # Readiness: stops traffic. App Platform's health_check IS the readiness
    # probe — it decides when an instance may receive requests.
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    # Liveness: restarts. A separate probe because the two questions differ —
    # "should this instance receive traffic yet" and "is this instance wedged
    # and beyond recovery" have different right answers, and conflating them
    # either restarts a merely-slow boot or leaves a hung process serving 502s.
    # failure_threshold is deliberately looser than readiness: killing a
    # container is the more expensive mistake.
    # /live checks only that the process answers. It was /health, which needs
    # the database: an outage over ~3 min restarted every replica into a boot
    # that fails closed while the DB is down — a crash loop on top of an
    # outage. A DB outage now makes replicas unready, not dead.
    liveness_health_check:
      http_path: /live
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 6
    # Graceful shutdown. drain_seconds stops new requests arriving before
    # SIGTERM is sent; grace_period_seconds is how long the process has to
    # finish what it already accepted before SIGKILL. Without these, a deploy
    # cuts off in-flight requests — including a Stripe webhook mid-write.
    termination:
      drain_seconds: 30
      grace_period_seconds: 120
    envs:
      - key: ORACLE_ENV
        value: "prod"
      - key: ORACLE_PROCESS_ROLE
        value: "web"
      # Per-replica WebSocket ceiling. The code default (120) would refuse the
      # 241st open tab across two replicas; 500 per replica was MEASURED to
      # hold (first frame p95 9 ms, <5% CPU, flat memory — docs/capacity-plan.md).
      - key: ORACLE_WS_MAX_CONNECTIONS
        value: "500"
      - key: ORACLE_PUBLIC_BASE_URL
        value: ${APP_URL}
      # The exact browser origin allowed credentialed CORS and /ws. Unset, the
      # API used to fall back to localhost dev origins in production (review
      # WEB-1); it now refuses to boot without a trusted https origin.
      - key: ORACLE_CORS_ORIGINS
        value: ${APP_URL}
      # Database — DigitalOcean Managed PostgreSQL. No Azure Entra / AWS IAM
      # token dance needed: db/connection.py's generic ORACLE_DB_PASSWORD path
      # (TLS via ORACLE_DB_SSLMODE=require) already covers this.
      - key: ORACLE_DB_HOST
        value: ${neoh-postgres.HOSTNAME}
      - key: ORACLE_DB_PORT
        value: ${neoh-postgres.PORT}
      - key: ORACLE_DB_NAME
        value: ${neoh-postgres.DATABASE}
      - key: ORACLE_DB_USER
        value: ${neoh-postgres.USERNAME}
      - key: ORACLE_DB_PASSWORD
        value: ${neoh-postgres.PASSWORD}
        type: SECRET
      - key: ORACLE_DB_SSLMODE
        value: "require"
      # Platform contexts (workers, webhooks, sign-in, the operator) connect as
      # oracle_platform_login — the only login RLS treats as platform admin
      # (migration 0120, review RLS-1). Its own secret: set the same value as
      # the CI environment secret the migration step uses to create the role.
      - key: ORACLE_DB_PLATFORM_PASSWORD
        type: SECRET
      - key: ORACLE_DB_PLATFORM_POOL_MAX
        value: "3"
      # Redis — DigitalOcean Managed Valkey. rediss:// (TLS) is parsed natively
      # by redis-py's from_url() in every one of the three call sites that use
      # it (rate_limiter.py, rate_limit_middleware.py, data_integrations/cache.py)
      # — no code change needed, just the URL scheme.
      - key: REDIS_URL
        value: ${neoh-redis.DATABASE_URL}
        type: SECRET
      # Object storage — Spaces, via the existing S3-compatible backend.
      - key: ORACLE_STORAGE_BACKEND
        value: "s3"
      - key: ORACLE_S3_BUCKET
        value: "neoh-media"
      - key: ORACLE_S3_REGION
        value: "nyc3"
      - key: ORACLE_S3_ENDPOINT_URL
        value: "https://nyc3.digitaloceanspaces.com"
      - key: ORACLE_S3_ACCESS_KEY_ID
        type: SECRET
      - key: ORACLE_S3_SECRET_ACCESS_KEY
        type: SECRET
      # Everything below is a secret an operator must fill in — see
      # docs/deploy-digitalocean.md §Secrets for the full list and where each
      # one comes from. Left blank here on purpose: never commit a value.
      - key: ORACLE_SECRET_KEY
        type: SECRET
      - key: ORACLE_ENCRYPTION_MASTER_KEY
        type: SECRET
      - key: ORACLE_ADMIN_ID
        type: SECRET
      - key: ORACLE_ADMIN_PASSPHRASE
        type: SECRET
      # Operator second factor (base32 TOTP secret). Production refuses to boot
      # with an operator and no secret. Generate: scripts/generate-operator-totp.py
      - key: ORACLE_ADMIN_TOTP_SECRET
        type: SECRET
      # …or email a one-time code to this address on each operator sign-in
      # (used when no TOTP secret is set). One of the two is required in prod.
      - key: ORACLE_ADMIN_OTP_EMAIL
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        type: SECRET
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
      - key: ORACLE_BRIDGE_ACCESS_TOKEN
        type: SECRET
      - key: ORACLE_SMTP_HOST
        type: SECRET
      - key: ORACLE_SMTP_USERNAME
        type: SECRET
      - key: ORACLE_SMTP_PASSWORD
        type: SECRET
      - key: ORACLE_FIREWORKS_API_KEY
        type: SECRET
      # Release identity is NOT set here on purpose.
      #
      # This used to be `ORACLE_GIT_SHA: ${_self.GIT_COMMIT_HASH}`, a RUNTIME
      # env var that overrode whatever the image had baked in. GET /version
      # exists to answer "which build is actually running", and that override
      # made it answer "which commit the platform thinks it deployed" instead —
      # a claim asserted rather than derived.
      #
      # The consequence was not cosmetic. smoke-test.sh compares /version's
      # git_sha against the release SHA, and the override made them agree no
      # matter which image was running, so the one check that would have caught
      # App Platform rebuilding from source reported success.
      #
      # ORACLE_GIT_SHA / ORACLE_APP_VERSION / ORACLE_BUILD_TIMESTAMP now come
      # only from the image's own ENV, set by --build-arg in the build that
      # produced it (backend/Dockerfile). An image can then only ever report
      # what it is.

  - name: web
    # The SPA runs as the frontend image's own nginx (port 8080), not as a
    # static site. App Platform static sites cannot set response headers, so
    # oracle-app/nginx.conf's CSP frame-ancestors, X-Frame-Options, HSTS,
    # nosniff and Permissions-Policy never reached the browser and the
    # authenticated app could be framed (security review WEB-3).
    #
    # Same change as api and worker, plus one wrinkle specific to Vite.
    #
    # VITE_* values are COMPILED INTO THE BUNDLE at build time; they are not
    # read at runtime. So while this component built from source, the envs
    # below were baked in by App Platform's build — and CI's own build of
    # `neoh-frontend` baked in DIFFERENT values, from GitHub secrets. The two
    # artifacts were not just different images of the same code, they were
    # configured differently, and whichever shipped, the other was the one
    # that had been tested.
    #
    # Pinning the digest resolves it: the bundle CI built is the bundle served,
    # with the values CI compiled into it. The envs are therefore GONE rather
    # than kept — a build-time variable listed on a prebuilt artifact
    # configures nothing and reads as though it does.
    #
    # `${api.PUBLIC_URL}` is lost with them; NEOH_PUBLIC_API_BASE in CI is the
    # same value supplied explicitly. That is a real trade: the spec no longer
    # derives the API origin, so a change to it requires a rebuild. For a value
    # that is already compiled into the bundle, it always did.
    image:
      registry_type: DOCR
      repository: neoh-frontend
      digest: __FRONTEND_DIGEST__
    http_port: 8080
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10

workers:
  - name: worker
    # The SAME image as api, pinned to the same digest — not merely the same
    # tag. A worker running a different build from the API is how a schema the
    # API expects and a job the worker runs drift apart inside one release.
    image:
      registry_type: DOCR
      repository: neoh-backend
      digest: __BACKEND_DIGEST__
    instance_count: 1
    instance_size_slug: apps-s-2vcpu-4gb
    # A worker mid-job needs longer than a request handler. The durable-job
    # layer heartbeats its lease, so a SIGKILL here does not lose work — the
    # lease expires and another worker reclaims it — but finishing cleanly
    # avoids the retry entirely.
    termination:
      drain_seconds: 30
      grace_period_seconds: 300
    envs:
      - key: ORACLE_ENV
        value: "prod"
      - key: ORACLE_PROCESS_ROLE
        value: "worker"
      # Durable job pools (automation_jobs.py). Interactive = Neoh chat replies,
      # on their own queue so a long MLS/harvest job never holds a person's
      # turn; this is also the ceiling on concurrent chat model calls. Each
      # turn holds a slot ~3.5 s, so slots ÷ 3.5 s = turns/s. Measured at 50
      # concurrent conversations (2.5-4 s mock model): 8 slots → 2.25 turns/s,
      # first-token p95 13.6 s (FAIL); 16 → 3.55 turns/s, p95 4.7 s, +4 DB
      # connections (docs/capacity-plan.md). A slower real model needs more.
      # Default-queue jobs are mostly I/O-bound (a model call per client
      # reconcile, provider syncs), so slots are cheap. At 4, three agents
      # editing clients continuously saturated it with crm:client_reconcile
      # (~2.8 s each) and lower-priority jobs waited ~200 s (Mission 8).
      - key: ORACLE_JOB_WORKERS
        value: "8"
      - key: ORACLE_INTERACTIVE_JOB_WORKERS
        value: "16"
      # 8 + 16 job workers + voice + reconstruction share this pool. Counted in
      # docs/database-connection-budget.md — recompute before raising.
      - key: ORACLE_DB_POOL_MAX
        value: "15"
      - key: ORACLE_MISSIONS_ENABLED
        value: "0" # flip to 1 once Missions is reviewed for this tenant
      - key: ORACLE_SCHEDULER_ENABLED
        value: "1"
      # Same database/redis/storage/secret bindings as the api service above —
      # doctl does not support YAML anchors in app specs, so these are
      # repeated rather than shared. Keep both lists in sync by hand, or
      # generate this file — see docs/deploy-digitalocean.md's note on that.
      - key: ORACLE_DB_HOST
        value: ${neoh-postgres.HOSTNAME}
      - key: ORACLE_DB_PORT
        value: ${neoh-postgres.PORT}
      - key: ORACLE_DB_NAME
        value: ${neoh-postgres.DATABASE}
      - key: ORACLE_DB_USER
        value: ${neoh-postgres.USERNAME}
      - key: ORACLE_DB_PASSWORD
        value: ${neoh-postgres.PASSWORD}
        type: SECRET
      - key: ORACLE_DB_SSLMODE
        value: "require"
      # Platform contexts (workers, webhooks, sign-in, the operator) connect as
      # oracle_platform_login — the only login RLS treats as platform admin
      # (migration 0120, review RLS-1). Its own secret: set the same value as
      # the CI environment secret the migration step uses to create the role.
      - key: ORACLE_DB_PLATFORM_PASSWORD
        type: SECRET
      - key: ORACLE_DB_PLATFORM_POOL_MAX
        value: "6"
      - key: REDIS_URL
        value: ${neoh-redis.DATABASE_URL}
        type: SECRET
      - key: ORACLE_STORAGE_BACKEND
        value: "s3"
      - key: ORACLE_S3_BUCKET
        value: "neoh-media"
      - key: ORACLE_S3_REGION
        value: "nyc3"
      - key: ORACLE_S3_ENDPOINT_URL
        value: "https://nyc3.digitaloceanspaces.com"
      - key: ORACLE_S3_ACCESS_KEY_ID
        type: SECRET
      - key: ORACLE_S3_SECRET_ACCESS_KEY
        type: SECRET
      - key: ORACLE_SECRET_KEY
        type: SECRET
      - key: ORACLE_ENCRYPTION_MASTER_KEY
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        type: SECRET
      - key: ORACLE_BRIDGE_ACCESS_TOKEN
        type: SECRET
      - key: ORACLE_SMTP_HOST
        type: SECRET
      - key: ORACLE_SMTP_USERNAME
        type: SECRET
      - key: ORACLE_SMTP_PASSWORD
        type: SECRET
      - key: ORACLE_FIREWORKS_API_KEY
        type: SECRET

# `ingress` (not the deprecated per-component `routes:`) is the current App
# Spec way to route paths to components. Order matters: FastAPI serves
# several top-level, non-/api-prefixed routers (auth.py's /auth, billing.py's
# /billing — including the Stripe webhook at /billing/webhook, admin_c2.py's
# /admin, client_portal.py's /portal) plus /health, /version, and the two WebSocket routes
# directly on `app` (server.py) — every one of those needs its own explicit
# rule, or it falls through to the last `/` rule and gets served 404s by the
# static site instead of reaching the API.
ingress:
  rules:
    - component: { name: api }
      match: { path: { prefix: /api } }
    - component: { name: api }
      match: { path: { prefix: /auth } }
    - component: { name: api }
      match: { path: { prefix: /billing } }
    - component: { name: api }
      match: { path: { prefix: /admin } }
    - component: { name: api }
      match: { path: { prefix: /ws } }
    - component: { name: api }
      match: { path: { prefix: /health } }
    - component: { name: api }
      match: { path: { prefix: /version } }
    # The client portal API (client_portal.py, prefix /portal). Without this
    # rule /portal/session/{token} fell through to the static site, so every
    # client secure-access link 404'd. The SPA page itself is /vault/....
    - component: { name: api }
      match: { path: { prefix: /portal } }
    # /docs, /redoc and /openapi.json are deliberately NOT routed: production
    # does not publish the API map (server.py _PUBLISH_API_DOCS, review WEB-2).
    - component: { name: web }
      match: { path: { prefix: / } }
