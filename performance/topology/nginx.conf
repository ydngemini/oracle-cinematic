# Round-robin over both web replicas, like App Platform's ingress — and it says
# which replica served each request (X-Perf-Upstream), so distribution across
# replicas is MEASURED rather than assumed (§17).
worker_processes 1;
events { worker_connections 8192; }
http {
  # Re-resolve replica names continuously. Resolved once at start, a restarted
  # replica's NEW address was never learned and its OLD one could be taken by
  # another container — Mission 8 found half of all traffic going to the
  # worker process this way. Docker's embedded DNS; `resolve` needs a zone.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream neoh_web {
    zone neoh_web 64k;
    server oracle-perf-web-1:8000 max_fails=0 resolve;
    server oracle-perf-web-2:8000 max_fails=0 resolve;
    keepalive 64;
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    client_max_body_size 50m;
    location / {
      proxy_pass http://neoh_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # APPEND, as DigitalOcean's ingress does: the rate limiter walks the chain
      # from the right and takes the first public address. A scenario may send
      # its own X-Forwarded-For to model many users on many networks — or many
      # users behind ONE office NAT, which is the case per-IP limits get wrong.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      add_header X-Perf-Upstream $upstream_addr always;
    }
  }
}
