services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  # Single-node local stand-in for Aurora. The `oracle` database, `postgres`
  # superuser, and plain password auth replace the IAM-token path that
  # db/connection.py uses in prod — it detects ORACLE_DB_PASSWORD and skips the
  # boto3/RDS CA bundle entirely, so the full RLS stack still runs correctly.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oracle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORACLE_DB_PASSWORD:?ORACLE_DB_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Apply migrations at container first-start. Order matters — psql runs
      # them alphabetically, which matches the 0001/0002/0003 numbering scheme.
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Deliberately NOT ORACLE_BIND_HOST: widening the app ports so a DinD
      # helper can forward them must never also publish the database. Every
      # service reaches Postgres over the compose network, so this publish is
      # only for a developer's local psql — override it knowingly or not at all.
      - "${ORACLE_DB_BIND_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oracle"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  # Uvicorn hot-reload is ON (--reload) so backend/ edits take effect instantly
  # without a container rebuild. In prod, swap CMD to remove --reload and set
  # ORACLE_DB_SSLMODE=require + real AWS creds for the IAM auth path.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_TEST_DEPS: "true"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # This compose stack IS the local dev environment. ORACLE_ENV=dev relaxes
      # the production secret gate (config.validate_or_die / auth.py fail-fast) so
      # the stack boots without prod-only secrets like ORACLE_ENCRYPTION_MASTER_KEY.
      ORACLE_ENV: dev
      # Real data only — synthetic Scout firehose stays OFF (no SCOUT_USE_MOCK).
      # AWS_REGION lets the Bedrock client attempt real AI (tour-gen/CMA/dossier);
      # degrades gracefully if model access isn't granted. Change if your Bedrock
      # models live in another region.
      AWS_REGION: us-east-1
      # Local dev DB override — tells db/connection.py to use plain password
      # auth against the compose postgres container, skipping the IAM path.
      ORACLE_DB_HOST: db
      ORACLE_DB_PORT: "5432"
      ORACLE_DB_NAME: oracle
      # NOT postgres. postgres is a superuser, and superusers bypass row-level
      # security unconditionally — so connecting as it locally disabled every
      # tenant boundary in the product while leaving the tests green. A brand
      # new broker could list another tenant's clients on a dev box, and no
      # amount of local testing would ever show it, because production connects
      # as oracle_app_login (rolbypassrls = false) and behaves correctly.
      # Develop against the isolation you ship.
      ORACLE_DB_USER: ${ORACLE_DB_USER:-oracle_app_login}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_APP_PASSWORD:?ORACLE_DB_APP_PASSWORD is required}
      ORACLE_DB_SSLMODE: disable
      # Development exercises the full surface. Production Terraform defaults
      # every new high-risk capability to false for staged rollout.
      ORACLE_FEATURE_AUTOMATION: "true"
      ORACLE_FEATURE_MUNICIPAL_HARVESTS: "true"
      ORACLE_FEATURE_PREDICTIVE_INTELLIGENCE: "true"
      ORACLE_FEATURE_MARKETPLACE: "true"
      ORACLE_FEATURE_LOCAL_MODELS: "true"
      ORACLE_FEATURE_SPATIAL_TOURS: "true"
      ORACLE_FEATURE_CONTRACTS: "true"
      ORACLE_FEATURE_AI_CHAT: "true"
      ORACLE_FEATURE_SALES_AI: "true"
      ORACLE_FEATURE_POWER_DIALER: "true"
      ORACLE_FEATURE_SMART_PLANS: "true"
      ORACLE_FEATURE_VIDEO_STUDIO: "true"
      ORACLE_AI_CHAT_MODEL: us.amazon.nova-pro-v1:0
      ORACLE_LOCAL_LLM_URL: http://host.docker.internal:8090/v1/chat/completions
      # Real local LLM — agent-mind's inner monologue streams from the llama.cpp
      # server running on the HOST (Llama-3.2-1B). The container reaches the host
      # via host.docker.internal (mapped to host-gateway in extra_hosts below).
      LLAMA_SERVER_URL: http://host.docker.internal:8090
      # Audit ledger SQLite fallback — the bind-mounted source tree is not
      # writable by the container user (uid 1001), so point it at /tmp.
      # Postgres is the primary store; this only catches degraded mode.
      ORACLE_AUDIT_SQLITE: /tmp/audit_logs.db
      # Gaussian-splat output dir. Points at the bind-mounted ./backend/.splatdata
      # (world-writable on the host so uid 1001 can write it) so generated .splat
      # files PERSIST across `docker compose up --force-recreate` instead of living
      # in the ephemeral /tmp fallback. This single var overrides spatial_agent's
      # scratch space for reconstruction providers that stage files on disk.
      # Finished splats go to object storage and are served by /api/media/{id}.
      ORACLE_SPLAT_DIR: /app/.splatdata
      # Durable media storage. Without this `object_storage.is_configured()` is
      # False on a laptop (the default /mnt/neoh exists only on a deployed
      # replica), and a finished reconstruction has nowhere to live — the job
      # fails at the very last step with "Object storage is not configured".
      #
      # It is a NAMED VOLUME, not a bind mount into ./backend, deliberately:
      # captured homeowner photos and finished reconstructions must never land
      # inside the git working tree.
      ORACLE_MEDIA_ROOT: /var/neoh-media
      # Which reconstruction actually runs. Unset means 'stub', which
      # synthesises a checkerboard room and captures nothing — fine as a default
      # for a laptop that has no GPU credentials, and exactly wrong once you are
      # trying to reconstruct a real house, because the job SUCCEEDS and stores a
      # demo. `runpod_pod` rents a GPU VM per job and returns .sog directly.
      # Serverless RunPod is a dead path for this account; pods work.
      RECONSTRUCTION_PROVIDER: ${RECONSTRUCTION_PROVIDER:-stub}
    # Linux Docker doesn't resolve host.docker.internal by default — map it to
    # the host gateway so the container can reach host-run services (the local
    # llama.cpp LLM on :8090) via LLAMA_SERVER_URL above.
    #
    # Under Docker-in-Docker, `host-gateway` resolves to the COMPOSE network
    # gateway (172.18.0.1), which cannot reach a server bound on the real host —
    # the LLM is only reachable via the outer bridge (172.17.0.1). Override with
    # ORACLE_HOST_GATEWAY_IP in that case; the default stays portable.
    extra_hosts:
      - "host.docker.internal:${ORACLE_HOST_GATEWAY_IP:-host-gateway}"
    volumes:
      # Mount source so --reload sees edits without rebuild.
      - ./backend:/app
      # The backend suite validates the isolated RunPod worker entrypoint too.
      # Keep it read-only; the application never writes into infrastructure code.
      - ./infra/reconstruction-runpod:/infra/reconstruction-runpod:ro
      # Captured media and finished splats. Outside the repo on purpose.
      - neoh_media:/var/neoh-media
    ports:
      - "${ORACLE_BIND_HOST:-127.0.0.1}:8000:8000"
    command: >
      uvicorn server:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app
        --timeout-graceful-shutdown 10

  # ── Vite dev server (React frontend) ─────────────────────────────────────────
  # Runs `npm run dev` on the supported Node 24 LTS line. The container needs internet access
  # on first run to fetch node_modules; after that, the bind-mount cache persists.
  # VITE_WS_URL points to the backend container via the host's loopback so the
  # browser WebSocket opens to localhost:8000, not the container hostname.
  frontend:
    image: node:24.18.0-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
      # Vite only reads .env files from the app root (oracle-app/), not the
      # repo root — forward the dev-only flags it needs from the compose env.
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      VITE_BILLING_BYPASS: ${VITE_BILLING_BYPASS:-false}
      # Google Maps Platform key for the photoreal 3D property tour (Map3DElement).
      # NOTE: VITE_* values are inlined into browser-visible client code, so this is
      # a PUBLIC / browser-exposed key — NOT a confidential secret. Lock it down via
      # HTTP-referrer + API restrictions in the Google Cloud Console; never place
      # confidential credentials on a VITE_ channel. Value comes from the repo-root .env.
      VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY:-}
      VITE_GOOGLE_MAP_ID: ${VITE_GOOGLE_MAP_ID:-}
    volumes:
      - ./oracle-app:/app
      - npm_cache:/app/node_modules
    ports:
      - "${ORACLE_BIND_HOST:-127.0.0.1}:5173:5173"
    # Install the committed stable dependency graph before starting Vite. The
    # named node_modules volume keeps restarts fast while npm ci prevents a
    # stale or canary-only graph from surviving a lockfile change.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  pg_data:    # PostgreSQL data — survives `docker compose down`
  npm_cache:  # node_modules cache — avoids full reinstall on container restart
  neoh_media: # captured photos + finished .sog — never inside the git tree
